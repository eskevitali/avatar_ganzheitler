<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avatar</title>
  <link rel="stylesheet" href="/app.css">
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/three.module.js",
      "three/addons/": "/vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <main>
    <!-- login:start -->
    <section id="login" class="card">
      <h1>Avatar</h1>
      <p>Вход в пробную страницу.</p>
      <form id="login-form" method="post" action="/api/login">
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Войти</button>
        <p id="login-error" class="status" role="alert"></p>
      </form>
    </section>
    <!-- login:end -->

    <section id="studio" hidden>
      <div id="doll" aria-label="Кукла"></div>
      <p class="hint">Учебная кукла. Свою маску подключим отдельно.</p>
      <section class="card controls">
        <div>
          <p class="label">Мимика</p>
          <div class="choices">
            <button type="button" data-mood="neutral" aria-pressed="true">Покой</button>
            <button type="button" data-mood="happy" aria-pressed="false">Улыбка</button>
            <button type="button" data-mood="sad" aria-pressed="false">Грусть</button>
            <button type="button" data-mood="angry" aria-pressed="false">Злость</button>
            <button type="button" data-mood="fear" aria-pressed="false">Испуг</button>
          </div>
        </div>
        <div>
          <p class="label">Губы</p>
          <div class="choices">
            <button type="button" data-viseme="PP">М</button>
            <button type="button" data-viseme="aa">А</button>
            <button type="button" data-viseme="O">О</button>
            <button type="button" data-viseme="I">И</button>
          </div>
        </div>
      </section>
      <form id="speak-form" class="card">
        <label for="text">Текст</label>
        <textarea id="text" name="text" rows="4" maxlength="4000" placeholder="Напишите фразу, которую кукла произнесёт" required></textarea>
        <div class="row">
          <button id="speak" type="submit">Сказать</button>
          <button id="logout" class="ghost" type="button">Выйти</button>
        </div>
        <p id="state" class="status" role="status">Покой</p>
      </form>
    </section>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
