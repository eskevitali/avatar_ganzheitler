<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avatar</title>
  <link rel="stylesheet" href="/app.css">
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/three.module.js",
      "three/addons/": "/vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <main>
    <!-- login:start -->
    <section id="login" class="card">
      <h1>Avatar</h1>
      <p>Верный пароль открывает куклу.</p>
      <form id="login-form" method="post" action="/api/login">
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Войти</button>
        <p id="login-error" class="status" role="alert"></p>
      </form>
    </section>
    <!-- login:end -->

    <section id="studio" hidden>
      <div id="doll" aria-label="Кукла"></div>
      <p class="hint">Выберите установленный профиль куклы.</p>
      <section class="card controls">
        <div>
          <label for="profile">Профиль куклы</label>
          <select id="profile" disabled aria-label="Профиль куклы"></select>
          <button type="button" id="save-profile" disabled>Сохранить губы и мимику профиля</button>
          <p class="hint">Настройки сохраняются отдельно для каждой куклы. Установка пакета описана в документации.</p>
          <p id="profile-errors" class="status error" role="alert"></p>
        </div>
        <div>
          <p class="label">Мимика</p>
          <div class="choices">
            <button type="button" data-mood="neutral" aria-pressed="true">Покой</button>
            <button type="button" data-mood="happy" aria-pressed="false">Улыбка</button>
            <button type="button" data-mood="sad" aria-pressed="false">Грусть</button>
            <button type="button" data-mood="angry" aria-pressed="false">Злость</button>
            <button type="button" data-mood="fear" aria-pressed="false">Испуг</button>
          </div>
        </div>
        <div>
          <p class="label">Губы</p>
          <div class="choices">
            <button type="button" data-viseme="PP" aria-pressed="false">М</button>
            <button type="button" data-viseme="aa" aria-pressed="false">А</button>
            <button type="button" data-viseme="O" aria-pressed="false">О</button>
            <button type="button" data-viseme="I" aria-pressed="false">И</button>
          </div>
          <div id="lip-tune" hidden>
            <p class="label" id="lip-tune-title">Форма</p>
            <div id="lip-sliders"></div>
            <button type="button" id="lip-reset" class="ghost">Сбросить губы</button>
          </div>
        </div>
      </section>
      <section class="card settings">
        <p class="label">Голос</p>
        <div class="choices">
          <button type="button" data-model="eleven_flash_v2_5" aria-pressed="false">Flash v2.5</button>
          <button type="button" data-model="eleven_v3_conversational" aria-pressed="false">v3 Conversational</button>
        </div>
        <label for="voice-id">ID голоса</label>
        <input id="voice-id" name="voiceId" autocomplete="off" spellcheck="false" maxlength="64" placeholder="ID голоса ElevenLabs">
        <button id="save-voice" class="ghost" type="button">Сохранить голос</button>
      </section>
      <form id="speak-form" class="card">
        <label for="text">Текст</label>
        <textarea id="text" name="text" rows="4" maxlength="4000" placeholder="Напишите фразу, которую кукла произнесёт" required></textarea>
        <div class="row">
          <button id="speak" type="submit">Сказать</button>
          <button id="repeat" class="ghost" type="button" aria-pressed="false" title="Крутить последнюю фразу без новой генерации">Повтор</button>
          <button id="logout" class="ghost" type="button">Выйти</button>
        </div>
        <p id="state" class="status" role="status">Покой</p>
      </form>
    </section>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
