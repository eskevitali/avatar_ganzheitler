name: avatarnode

services:
  web:
    build: .
    image: avatarnode-web:0.1.0
    container_name: avatarnode-web
    restart: unless-stopped
    env_file:
      - /opt/avatarnode/secrets/app.env
    volumes:
      - /opt/avatarnode/settings:/data/settings
    networks:
      - web
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  web:
    external: true
    name: web_network
